<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>途变在线考试系统 · 知道你在改变</title>
  <script>
    // 首帧前同步定主题，避免深色用户看到浅色闪屏（与 splashscreen 同法；
    // custom:<id> 先按基础皮肤渲染，JS 起来后 restoreTheme 再恢复完整主题包）
    (function () {
      try {
        if (localStorage.getItem("dotobe.theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) { /* 拿不到 localStorage 时保持浅色 */ }
    })();
  </script>
  <link rel="stylesheet" href="assets/katex/katex.min.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/pages.css?v=20260928" />
  <link rel="stylesheet" href="css/market.css?v=20260928" />
  <link rel="stylesheet" href="css/loading-scene.css" />
  <link rel="stylesheet" href="css/exam-sim.css" />
  <style>
    /* —— 启动衔接层：与 splashscreen 窗口同一画面。主窗口显示瞬间两者像素级
       相接，用户无感切换；markAppReady() 后整体 500ms 淡出并移除。 —— */
    #boot-splash {
      position: fixed; inset: 0; z-index: 99998; /* 低于 __fatal 错误横幅，保证致命错误可见 */
      display: grid; place-items: center;
      background: var(--rice);
      font-family: var(--font);
      overflow: hidden;
      transition: opacity 500ms var(--ease);
    }
    html:not([data-theme="dark"]) #boot-splash {
      background: #f6f4ef;
      background-image: radial-gradient(ellipse 80% 70% at 50% 42%,
        #fefdfb 0%, #f4f1ea 52%, #e8e4da 100%);
    }
    #boot-splash.boot-fade { opacity: 0; pointer-events: none; }
    #boot-splash .bs-center { display: flex; flex-direction: column; align-items: center; }
    #boot-splash .bs-logo {
      font-size: var(--fs-hero); font-weight: 200; letter-spacing: 0.04em;
      color: var(--sky);
      animation: boot-logo-in 900ms var(--wa-ease) both;
    }
    #boot-splash .bs-tagline {
      margin-top: 14px; font-size: var(--fs-small); font-weight: 300;
      color: var(--text-2); letter-spacing: 0.32em; text-indent: 0.32em;
      animation: boot-rise var(--dur) var(--wa-ease) 250ms both;
    }
    #boot-splash .bs-dots {
      display: flex; gap: 12px; margin-top: 56px;
      animation: boot-rise var(--dur) var(--wa-ease) 500ms both;
    }
    #boot-splash .bs-dots i {
      width: 8px; height: 8px; border-radius: var(--r-full);
      animation: boot-breathe 2.4s var(--ease) infinite both;
    }
    #boot-splash .bs-dots i:nth-child(1) { background: var(--sky); }
    #boot-splash .bs-dots i:nth-child(2) { background: var(--mint); animation-delay: 0.3s; }
    #boot-splash .bs-dots i:nth-child(3) { background: var(--powder); animation-delay: 0.6s; }
    #boot-splash .bs-flora { position: absolute; inset: 0; pointer-events: none; }
    #boot-splash .bs-plant { position: absolute; opacity: 0.85; }
    #boot-splash .bs-plant svg {
      width: 100%; height: 100%; display: block;
      transform-origin: 50% 100%; /* 摇曳以根部为轴 */
      animation: boot-sway var(--sdur, 7s) var(--ease) var(--sd, 3s) infinite alternate;
    }
    #boot-splash path, #boot-splash circle {
      fill: none; stroke: var(--mint); stroke-width: 1; stroke-linecap: round;
      stroke-dasharray: 1; stroke-dashoffset: 0;
      animation: boot-draw var(--dd, 1.4s) var(--ease) var(--d, 0s) both;
    }
    #boot-splash circle { stroke: var(--pink); }
    @keyframes boot-draw {
      0%   { stroke-dashoffset: 1; opacity: 0; } /* 起笔前隐藏圆头伪影 */
      8%   { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes boot-logo-in {
      from { opacity: 0; letter-spacing: 0.3em; }
      to   { opacity: 1; letter-spacing: 0.04em; }
    }
    @keyframes boot-rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes boot-breathe {
      0%, 100% { transform: scale(0.72); opacity: 0.45; }
      50%      { transform: scale(1);    opacity: 1; }
    }
    @keyframes boot-sway {
      from { transform: rotate(-0.6deg); }
      to   { transform: rotate(0.6deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash, #boot-splash * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
